{% set name = "marshmallow-jsonschema" %}
{% set version = "0.14.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9ffe721b1a8669a6ed9dd7cc36cf5465a39982c6f9802febe9c35975b27722d2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - python {{ python_min }}
  run:
    - marshmallow >=3.11
    - python >={{ python_min }}

test:
  imports:
    - marshmallow_jsonschema
    - marshmallow_jsonschema.extensions
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fuhrysteve/marshmallow-jsonschema
  summary: JSON Schema Draft v7 (http://json-schema.org/) formatting with marshmallow
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - fuhrysteve
    - k-dominik
